spring:
  application:
    name: contact-manager
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/contactmanager}
    username: ${SPRING_DATASOURCE_USERNAME:contactmanager}
    password: ${SPRING_DATASOURCE_PASSWORD:contactmanager}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

contact-manager:
  jwt:
    secret: ${CONTACT_MANAGER_JWT_SECRET}
    issuer: contact-manager
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  auth:
    cookie:
      secure: ${CONTACT_MANAGER_COOKIE_SECURE:true}
      same-site: ${CONTACT_MANAGER_COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${CONTACT_MANAGER_CORS_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.contactmanager: INFO
